<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — UK Energy Grid</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 400px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-bottom: 2rem;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: #16a34a;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px;
  }
  .logo-text { font-size: 1.1rem; font-weight: 700; color: #111; }
  .logo-sub  { font-size: .75rem; color: #6b7280; margin-top: 1px; }
  h1 { font-size: 1.4rem; font-weight: 700; color: #111; margin-bottom: .4rem; }
  p.sub { font-size: .875rem; color: #6b7280; margin-bottom: 1.75rem; }
  label { display: block; font-size: .8rem; font-weight: 600; color: #374151; margin-bottom: .35rem; }
  input[type=email], input[type=password] {
    width: 100%;
    padding: .65rem .85rem;
    border: 1.5px solid #d1d5db;
    border-radius: 8px;
    font-size: .9rem;
    outline: none;
    transition: border-color .15s;
    margin-bottom: 1rem;
  }
  input:focus { border-color: #16a34a; }
  .error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    border-radius: 8px;
    padding: .6rem .85rem;
    font-size: .8rem;
    margin-bottom: 1rem;
  }
  button[type=submit] {
    width: 100%;
    padding: .75rem;
    background: #16a34a;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
    margin-top: .25rem;
  }
  button[type=submit]:hover { background: #15803d; }
  .footer { text-align: center; margin-top: 1.5rem; font-size: .85rem; color: #6b7280; }
  .footer a { color: #16a34a; text-decoration: none; font-weight: 500; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">&#9889;</div>
    <div>
      <div class="logo-text">UK Energy Grid</div>
      <div class="logo-sub">Smart charging dashboard</div>
    </div>
  </div>

  <h1>Welcome back</h1>
  <p class="sub">Sign in to track savings and set alerts.</p>

  <div id="err-msg" class="error" style="display:none"></div>

  <form method="post" action="/auth/login">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">

    <button type="submit">Sign in</button>
  </form>

  <p class="footer">No account? <a href="/signup">Create one free</a></p>
</div>

<script>
  const p = new URLSearchParams(location.search);
  if (p.get('error') === 'invalid') {
    const el = document.getElementById('err-msg');
    el.textContent = 'Incorrect email or password.';
    el.style.display = '';
  }
</script>
</body>
</html>
